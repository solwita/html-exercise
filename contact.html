    <!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | GenAI Hub</title>
</head>

  <main class="container">
    <div class="heading">
      <h1>Contact Us</h1>
    </div>

    <p class="intro">
      Use this form to send feedback, questions, or suggestions about GenAI Hub.
    </p>

    <section class="info-section">
      <h2>Contact Form</h2>

      <form id="contactForm" class="contact-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="reason">Reason for Contact</label>
        <select id="reason">
          <option value="">Select a reason</option>
          <option value="feedback">Website feedback</option>
          <option value="tool">Suggest an AI tool</option>
          <option value="safety">AI safety question</option>
          <option value="other">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Write your message here"></textarea>

        <button type="submit">Submit</button>
      </form>

      <p id="formMessage"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
